<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>KalkiFit — statistika (admin)</title>
<style>
:root{color-scheme:light dark;--bg:#F1F2EE;--card:#fff;--ink:#16211C;--mut:#3F4F46;--line:#D5DDD8;--acc:#0E3B2E;--ok:#1E7A4A;--bad:#B2412F;--c1:#E8572F;--c2:#2F7FD6}
@media (prefers-color-scheme:dark){:root{--bg:#0F1714;--card:#18231E;--ink:#EEF3F0;--mut:#B9C7BF;--line:#2A3830;--acc:#8FDDB4;--ok:#3FAE78;--bad:#FF9B8A;--c1:#FF8A6F;--c2:#7FB6F5}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
main{max-width:980px;margin:0 auto}h1{font-size:1.35rem;margin:0 0 4px}h2{font-size:1.05rem;margin:0 0 8px}p.s{color:var(--mut);margin:0 0 12px;font-size:.92rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
input,button{font:inherit;color:inherit;min-height:44px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:0 12px}
button{cursor:pointer;font-weight:700}button.p{background:var(--ok);border-color:var(--ok);color:#fff}button.on{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{min-width:64px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:0 0 12px}
.k{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}.k small{display:block;color:var(--mut);font-size:.8rem;font-weight:600}.k b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}.k i{font-style:normal;font-size:.82rem;font-weight:700}.up{color:var(--ok)}.dn{color:var(--bad)}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 12px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block}.lg{display:flex;gap:14px;font-size:.85rem;color:var(--mut)}.lg span::before{content:"";display:inline-block;width:12px;height:3px;margin-right:6px;vertical-align:middle;background:var(--c)}
#msg{min-height:1.4em;color:var(--bad);font-weight:700}textarea{width:100%;min-height:220px;font:14px/1.5 ui-monospace,Menlo,monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
</style></head><body><main>
<h1>KalkiFit — statistika</h1>
<p class="s">Anonim: qurilma — xesh, shaxsiy ma'lumot yo'q. Demo, preview va botlar hisoblanmaydi. Kunlik qurilma qatorlari 35 kundan keyin o'chadi (faqat yig'ma son qoladi).</p>
<div class="bar"><input id="pw" type="password" placeholder="Parol" autocomplete="current-password"><button id="go" class="p">Kirish</button></div>
<div class="bar seg" id="davr" role="group" aria-label="Davr"><button data-d="1">Bugun</button><button data-d="7" class="on">7 kun</button><button data-d="30">30 kun</button><button data-d="0">Hammasi</button><button id="csv">CSV</button><button id="pr">PR uchun hisobot</button></div>
<div id="msg" role="status"></div>
<div id="out"></div>
<script src="/assets/translit.js"></script><script src="/assets/stat-pr.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)},pw=sessionStorage.getItem('kf_adm')||'',davr=7,last=null;if(pw)$('pw').value=pw;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var nf=function(n){return n==null?'—':KalkiStatPR.nf(n)};
var KPI=[['dau','DAU (o\'rtacha)'],['wau','WAU'],['mau','MAU'],['yangi','Yangi foydalanuvchilar'],['onboarding','Onboarding, %'],['ret1','1-kun retention, %'],['ret7','7-kun retention, %'],['apk','APK yuklash'],['ai','AI so\'rovlar (ovozsiz)'],['ovoz','Ovozli so\'rovlar'],['baliq','Baliq kuni obunachilari']];
var NOM={faol:'Faol (kuniga 1)',yangi_foydalanuvchi:'Yangi foydalanuvchi',til_tanlandi:'Til tanlandi',onboarding_tugadi:'Onboarding tugadi',onboarding_keyinroq:'Onboarding: Keyinroq',ovqat_qoshildi:'Ovqat qo\'shildi',qidiruv_topilmadi:'Qidiruv: topilmadi',yeymiz_chip:'Yeymiz: chip',yeymiz_segment:'Yeymiz: bo\'lim',buyurtma_hamkor:'Buyurtma (hamkor)',ai_sorov:'AI so\'rov',suv_qoshildi:'Suv qo\'shildi',qadam_ulandi:'Qadam ulandi',baliq_kuni_obuna:'Baliq kuni: obuna',baliq_kuni_bekor:'Baliq kuni: bekor',push_yuborildi:'Push yuborildi',push_bosildi:'Push bosildi',apk_yuklandi:'APK yuklandi',ilova_yangilandi:'Ilova yangilandi',kun_kartochka_ulashildi:'Kun kartochkasi ulashildi',hazil_yopildi:'Hazil yopildi',haftalik_ochildi:'Haftalik xulosa ochildi'};
function delta(a,b){if(a==null||b==null||!b)return'';var p=Math.round((a-b)/b*100);return' <i class="'+(p>=0?'up':'dn')+'">'+(p>=0?'↑':'↓')+Math.abs(p)+'%</i>'}
function chart(s){var W=640,H=180,P=24,mx=Math.max(1,Math.max.apply(null,s.map(function(x){return Math.max(x.dau,x.yangi)}))),X=function(i){return P+i*(W-2*P)/Math.max(1,s.length-1)},Y=function(v){return H-P-v*(H-2*P)/mx};
 var line=function(k,c){return'<polyline fill="none" stroke="'+c+'" stroke-width="2.5" stroke-linejoin="round" points="'+s.map(function(x,i){return X(i).toFixed(1)+','+Y(x[k]).toFixed(1)}).join(' ')+'"/>'};
 return'<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="30 kunlik DAU va yangi"><line x1="'+P+'" y1="'+(H-P)+'" x2="'+(W-P)+'" y2="'+(H-P)+'" stroke="var(--line)"/><text x="'+P+'" y="14" font-size="11" fill="var(--mut)">'+mx+'</text>'+line('dau','var(--c1)')+line('yangi','var(--c2)')+'<text x="'+P+'" y="'+(H-6)+'" font-size="11" fill="var(--mut)">'+s[0].kun.slice(5)+'</text><text x="'+(W-P)+'" y="'+(H-6)+'" font-size="11" fill="var(--mut)" text-anchor="end">'+s[s.length-1].kun.slice(5)+'</text></svg><div class="lg"><span style="--c:var(--c1)">DAU</span><span style="--c:var(--c2)">Yangi</span></div>'}
function share(list,nom){var t=list.reduce(function(a,x){return a+(x.n||0)},0);if(!t)return'<p class="s">Ma\'lumot yo\'q.</p>';return'<table>'+list.map(function(x){return'<tr><td>'+esc(nom[x.k]||x.k)+'</td><td class="n">'+nf(x.n)+'</td><td class="n">'+Math.round(x.n/t*100)+'%</td></tr>'}).join('')+'</table>'}
function render(r){last=r;var k=r.kpi,o=r.oldingi||{};
 var h='<div class="g">'+KPI.map(function(x){return'<div class="k"><small>'+esc(x[1])+'</small><b>'+nf(k[x[0]])+'</b>'+(r.oldingi&&x[0]!=='baliq'?delta(k[x[0]],o[x[0]]):'')+'</div>'}).join('')+'</div>';
 h+='<div class="c"><h2>30 kun: DAU va yangi foydalanuvchilar</h2>'+chart(r.seriya)+'</div>';
 h+='<div class="two"><div class="c"><h2>Platforma</h2>'+share(r.platforma,{veb:'Veb',android:'Android','ios-pwa':'iPhone (PWA)'})+'</div><div class="c"><h2>Til</h2>'+share(r.til,{uz:'UZ',cyr:'ЎЗ',ru:'RU'})+'</div></div>';
 h+='<div class="c"><h2>Push: yuborilgan → bosilgan</h2><p>'+nf(r.push.yuborildi)+' → '+nf(r.push.bosildi)+(r.push.foiz!=null?' ('+nf(r.push.foiz)+'%)':'')+'</p></div>';
 h+='<div class="c"><h2>Funksiyalar</h2>'+(r.funksiyalar.length?'<table><tr><th>Hodisa</th><th>Kalit</th><th class="n">Soni</th></tr>'+r.funksiyalar.map(function(x){return'<tr><td>'+esc(NOM[x.hodisa]||x.hodisa)+'</td><td>'+esc(x.kalit)+'</td><td class="n">'+nf(x.son)+'</td></tr>'}).join('')+'</table>':'<p class="s">Hali hodisa yo\'q.</p>')+'</div>';
 h+='<div class="c"><h2>Qidiruvda topilmagan 20 so\'z</h2>'+(r.topilmadi.length?'<table>'+r.topilmadi.map(function(x){return'<tr><td>'+esc(x.soz)+'</td><td class="n">'+nf(x.son)+'</td></tr>'}).join('')+'</table>':'<p class="s">Yo\'q.</p>')+'</div><div id="prBox"></div>';
 $('out').innerHTML=h}
function load(){$('msg').textContent='Yuklanmoqda…';fetch('/api/stat?davr='+davr,{headers:{'X-Admin-Password':pw}}).then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})}).then(function(x){if(!x.ok){$('msg').textContent=x.j.xato||'Xato';return}$('msg').textContent='';render(x.j)}).catch(function(){$('msg').textContent='Tarmoq xatosi'})}
$('go').onclick=function(){pw=$('pw').value;sessionStorage.setItem('kf_adm',pw);load()};
[].forEach.call(document.querySelectorAll('#davr [data-d]'),function(b){b.onclick=function(){davr=+b.getAttribute('data-d');[].forEach.call(document.querySelectorAll('#davr [data-d]'),function(x){x.classList.toggle('on',x===b)});if(pw)load()}});
$('csv').onclick=function(){if(!last)return;var rows=[['bo\'lim','kalit','qiymat']];KPI.forEach(function(x){rows.push(['kpi',x[0],last.kpi[x[0]]==null?'':last.kpi[x[0]]])});last.seriya.forEach(function(x){rows.push(['dau',x.kun,x.dau]);rows.push(['yangi',x.kun,x.yangi])});last.funksiyalar.forEach(function(x){rows.push(['hodisa',x.hodisa+(x.kalit?'.'+x.kalit:''),x.son])});last.topilmadi.forEach(function(x){rows.push(['topilmadi',x.soz,x.son])});
 var csv=rows.map(function(r){return r.map(function(v){v=String(v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')}).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));a.download='kalkifit-statistika-'+last.gacha+'-'+(last.davr||'hammasi')+'.csv';document.body.appendChild(a);a.click();a.remove()};
$('pr').onclick=function(){if(!last)return;var tr=window.KalkiTranslit&&KalkiTranslit.translit?KalkiTranslit.translit:(window.translit||null),box=$('prBox');
 box.innerHTML='<div class="c"><h2>PR uchun hisobot</h2><div class="seg" id="prL"><button data-l="uz" class="on">UZ</button><button data-l="cyr">ЎЗ</button><button data-l="ru">RU</button><button id="prC">Nusxa olish</button></div><textarea id="prT" readonly></textarea></div>';
 var set=function(l){$('prT').value=KalkiStatPR.build(last,l,tr);[].forEach.call(document.querySelectorAll('#prL [data-l]'),function(x){x.classList.toggle('on',x.getAttribute('data-l')===l)})};set('uz');
 [].forEach.call(document.querySelectorAll('#prL [data-l]'),function(b){b.onclick=function(){set(b.getAttribute('data-l'))}});$('prC').onclick=function(){var t=$('prT');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}};box.scrollIntoView({behavior:'smooth'})};
if(pw)load();
})();
</script></main></body></html>
