<style>
:root{--cat:#1A2B24;--accent:#D99A2B;--cat-text:#C9D6CE;--paper:#F7F8F6;--card:#FFFFFF;--ink:#16211C;--muted:#5C6B63;--line:#DDE5E0;--radius:14px}

body{font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--paper);color:var(--ink);line-height:1.65;min-height:100vh}

.brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--cat-text);text-decoration:none}
.brand-dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.lang-seg{display:flex;background:rgba(255,255,255,.14);border-radius:9px;padding:3px;gap:3px}
.lang-seg button{border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:800;color:var(--cat-text);padding:6px 12px;border-radius:7px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.lang-seg button.on{background:#fff;color:var(--cat)}

h1{font-size:24px;font-weight:800;line-height:1.25}
.meta{margin-top:10px;font-size:12.5px;color:var(--cat-text);font-weight:600}
main{padding-top:24px;font-size:15.5px}
main h2{font-size:19px;font-weight:800;margin:26px 0 10px}
main p{margin-bottom:12px}
main ul{margin:0 0 12px 22px}
main li{margin-bottom:7px}
main strong{font-weight:800}
.cta-calc{margin:24px 0;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:16px 18px}
.cta-calc .t{font-weight:800;font-size:15px;margin-bottom:4px}
.cta-calc .d{font-size:13.5px;color:var(--muted);margin-bottom:12px}
.cta-calc a{display:inline-block;background:var(--cat);color:#fff;font-weight:800;font-size:14px;padding:10px 18px;border-radius:9px;text-decoration:none}
.disclaimer{margin-top:24px;background:#EEF2EF;border-radius:10px;padding:13px 15px;font-size:12.5px;color:var(--muted);line-height:1.5}
footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}

<script>
(function(){
  var DATA={"uz": {"tag": "Ta’lim", "title": "DTM 2026: ball qanday hisoblanadi va grantga qancha kerak", "body": "<p>Har yili yuz minglab abituriyent DTM (Davlat test markazi) imtihoniga kiradi. Ball qanday hisoblanishini tushunish — strategiya tuzish va grantga kirish uchun muhim. Keling, batafsil ko’rib chiqamiz.</p><h2>Ball qanday hisoblanadi?</h2><p>DTM imtihonida savollar uch blokga bo’linadi, har biri turli koeffitsiyentga ega:</p><ul><li><strong>1-blok (asosiy fan)</strong> — koeffitsiyent 3.1. Har to’g’ri javob 3.1 ball.</li><li><strong>2-blok</strong> — koeffitsiyent 2.1.</li><li><strong>3-blok (majburiy fanlar)</strong> — koeffitsiyent 1.1.</li></ul><p>Maksimal ball — <strong>189</strong>. Bu 1-blokdan 93, 2-blokdan 63, 3-blokdan 33 ball yig’indisi.</p><h2>Sertifikat imtiyozları</h2><p>Til sertifikati (IELTS, CEFR) yoki milliy fan sertifikati bo’lsa, tegishli fandan qo’shimcha yoki to’liq ball olasiz. Masalan B2+ ingliz tili sertifikati ingliz tili fanidan 100% ball beradi — bu imtihon topshirmasdan ball olish degani.</p><div class=\"cta-calc\"><div class=\"t\">Ballingizni hisoblang</div><div class=\"d\">Har blokdagi to’g’ri javoblarni kiritib, umumiy ballni ko’ring.</div><a href=\"dtm-kalkulyator\">DTM kalkulyatori →</a></div><h2>Grant uchun qancha ball kerak?</h2><p>Grant uchun aniq ball chegarasi yo’q — u har yili yo’nalish, universitet va grant o’rinlari soniga qarab o’zgaradi. Odatda mashhur yo’nalishlarda (tibbiyot, IT, xalqaro munosabatlar) 160+ ball kerak. Kamroq raqobatli yo’nalishlarda 130–150 ham yetishi mumkin. O’tgan yilgi o’tish balllarini ko’rib chiqing.</p><h2>Ballni qanday oshirish mumkin?</h2><p>Eng samarali strategiya — 1-blokga (koeffitsiyent 3.1) e’tibor berish, chunki u eng ko’p ball beradi. Bundan tashqari, til yoki milliy sertifikat olish katta yordam beradi. DTM kalkulyatorida turli stsenariylarni sinab, qaysi yo’l ko’proq ball berishini ko’ring.</p><div class=\"disclaimer\">Maqola umumiy ma’lumot uchun. Aniq qoidalar va ball chegaralari uchun DTM rasmiy manbalarini tekshiring.</div>"}, "ru": {"tag": "Образование", "title": "ДТМ 2026: как считается балл и сколько нужно на грант", "body": "<p>Каждый год сотни тысяч абитуриентов сдают экзамен ДТМ. Понимание того, как считается балл, важно для стратегии и поступления на грант. Разберём подробно.</p><h2>Как считается балл?</h2><p>Вопросы на экзамене ДТМ делятся на три блока, каждый со своим коэффициентом:</p><ul><li><strong>1-й блок (профильный)</strong> — коэффициент 3.1. Каждый верный ответ — 3.1 балла.</li><li><strong>2-й блок</strong> — коэффициент 2.1.</li><li><strong>3-й блок (обязательные)</strong> — коэффициент 1.1.</li></ul><p>Максимальный балл — <strong>189</strong>. Это сумма 93 из 1-го блока, 63 из 2-го и 33 из 3-го.</p><h2>Льготы по сертификатам</h2><p>При наличии языкового (IELTS, CEFR) или национального сертификата по предмету вы получаете дополнительный или полный балл. Например, сертификат B2+ по английскому даёт 100% по английскому — то есть балл без сдачи экзамена.</p><div class=\"cta-calc\"><div class=\"t\">Посчитайте свой балл</div><div class=\"d\">Введите число верных ответов по блокам и увидите общий балл.</div><a href=\"dtm-kalkulyator\">Калькулятор ДТМ →</a></div><h2>Сколько баллов нужно на грант?</h2><p>Точного порога для гранта нет — он меняется каждый год в зависимости от направления, вуза и числа грантовых мест. Обычно на популярных направлениях (медицина, IT, международные отношения) нужно 160+. На менее конкурентных хватает 130–150. Смотрите проходные баллы прошлого года.</p><h2>Как повысить балл?</h2><p>Самая эффективная стратегия — упор на 1-й блок (коэффициент 3.1), так как он даёт больше всего баллов. Кроме того, языковой или национальный сертификат сильно помогает. Пробуйте разные сценарии в калькуляторе ДТМ.</p><div class=\"disclaimer\">Статья для общего ознакомления. За точными правилами и проходными баллами проверяйте официальные источники ДТМ.</div>"}};
  var UI={uz:{back:'← Barcha maqolalar',home:'Bosh sahifa',date:'18-iyul, 2026'},ru:{back:'← Все статьи',home:'Главная',date:'18 июля 2026'}};
  var lang='uz';
  function render(){
    document.documentElement.lang=lang;
    document.getElementById('artTag').textContent=DATA[lang].tag;
    document.getElementById('artTitle').textContent=DATA[lang].title;
    document.getElementById('artMeta').textContent=UI[lang].date;
    document.getElementById('artBody').innerHTML=DATA[lang].body;
    document.getElementById('backBlog').textContent=UI[lang].back;
    document.getElementById('backHome').textContent=UI[lang].home;
    document.getElementById('langUz').classList.toggle('on',lang==='uz');
    document.getElementById('langRu').classList.toggle('on',lang==='ru');
    buildSchema();
  }
  function buildSchema(){
    var old=document.getElementById('art-ld');if(old)old.remove();
    var s=document.createElement('script');s.type='application/ld+json';s.id='art-ld';
    s.textContent=JSON.stringify({"@context":"https://schema.org","@type":"Article",
      "headline":DATA[lang].title,"datePublished":"2026-07-18","inLanguage":lang,
      "author":{"@type":"Organization","name":"Kalki.uz"},
      "publisher":{"@type":"Organization","name":"Kalki.uz"}});
    document.head.appendChild(s);
  }
  document.getElementById('langUz').onclick=function(){lang='uz';render()};
  document.getElementById('langRu').onclick=function(){lang='ru';render()};
  render();
})();
</script>
