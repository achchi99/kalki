(function(){
  var DATA={"uz": {"tag": "Moliya", "title": "2026-yilda ipoteka: stavkalar, imtiyozlar va hisob-kitob", "body": "<p>Uy sotib olish — ko’pchilik uchun hayotdagi eng katta xarid. O’zbekistonda bu ko’pincha ipoteka orqali amalga oshiriladi. 2026-yilda ipoteka bozori qanday, qanday imtiyozlar bor va oylik to’lovni qanday hisoblash mumkin — shu haqda gaplashamiz.</p><h2>Ipoteka stavkalari 2026-yilda</h2><p>Tijorat banklarining oddiy ipoteka stavkalari 2026-yilda yillik 20–28% atrofida. Bu yuqori ko’rinadi, lekin O’zbekistonda inflyatsiya va bozor stavkalari shunga mos. Muhimi — bu stavka uzoq muddat (10–20 yil) davomida katta summaga aylanadi, shuning uchun har foiz muhim.</p><h2>Imtiyozli ipoteka dasturlari</h2><p>Davlat ba’zi toifalarga past foizli ipoteka beradi:</p><ul><li><strong>Yoshlar ipotekasi</strong> — yosh oilalar uchun past stavka va qulay shartlar.</li><li><strong>Ko’p bolali oilalar</strong> — subsidiya va past foiz.</li><li><strong>Davlat xizmatchilari</strong> — o’qituvchi, shifokor va boshqalar uchun maxsus dasturlar.</li></ul><p>Imtiyozli stavka 7–14% bo’lishi mumkin — bu oddiy stavkaning deyarli yarmi. Agar shu toifalarga kirsangiz, albatta foydalaning.</p><h2>Oylik to’lovni qanday hisoblash mumkin?</h2><p>Oylik to’lov to’rt narsaga bog’liq: uy narxi, boshlang’ich to’lov, foiz stavka va muddat. Masalan 500 mln so’mlik uyga 20% (100 mln) boshlang’ich to’lov bilan, 15% imtiyozli stavkada, 15 yilga ipoteka olsangiz — oylik to’lov taxminan 5,6 mln so’m atrofida bo’ladi.</p><div class=\"cta-calc\"><div class=\"t\">O’z hisob-kitobingizni qiling</div><div class=\"d\">Uy narxi, boshlang’ich to’lov va stavkani kiritib, oylik to’lovni ko’ring.</div><a href=\"ipoteka-kalkulyator\">Ipoteka kalkulyatori →</a></div><h2>Ipoteka olishdan oldin nimaga e’tibor berish kerak?</h2><p>Birinchi — oylik to’lov daromadingizning 40% идан oshmasligini tekshiring. Ikkinchi — sug’urta (uy va hayot) ipotekada majburiy, buni ham hisobga oling. Uchinchi — bir necha bankni solishtiring, chunki stavka va shartlar farq qiladi. To’rtinchi — erta yopish imkoniyati va jarimasini bilib oling.</p><div class=\"disclaimer\">Ushbu maqola umumiy ma’lumot uchun. Aniq stavka va shartlar uchun banklarga murojaat qiling. Raqamlar 2026-yil holatiga ko’ra taxminiy.</div>", "faq": [{"q": "Ipoteka uchun qancha maosh kerak?", "a": "Bank odatda oylik to'lov daromadning 50% idan oshmasligini talab qiladi. Masalan 5 mln so'm oylik to'lov uchun kamida 10 mln so'm rasmiy daromad kerak. Aniq talab bankka qarab farq qiladi."}, {"q": "Ipotekani muddatidan oldin yopsa bo'ladimi?", "a": "Ha, ko'pincha mumkin. Bu qolgan foizni tejaydi. Lekin ba'zi banklar erta yopish uchun jarima qo'yishi mumkin — shartnomani oldindan tekshiring."}, {"q": "Boshlang'ich to'lovsiz ipoteka bormi?", "a": "Ba'zi imtiyozli davlat dasturlarida boshlang'ich to'lov kam yoki nol bo'lishi mumkin. Oddiy tijorat ipotekasida esa 15-25% talab qilinadi."}, {"q": "Ipoteka uyni sotish mumkinmi?", "a": "Ipoteka to'lanmagan uy garovda bo'ladi, uni sotish uchun bank roziligi kerak. Odatda qolgan qarzni yopib, keyin sotiladi yoki xaridorga qarz o'tkaziladi."}]}, "ru": {"tag": "Финансы", "title": "Ипотека в 2026: ставки, льготы и расчёт", "body": "<p>Покупка жилья — самая крупная трата в жизни для многих. В Узбекистане это часто делается через ипотеку. Какой ипотечный рынок в 2026 году, какие есть льготы и как рассчитать платёж — об этом поговорим.</p><h2>Ставки по ипотеке в 2026</h2><p>Обычные ставки коммерческих банков в 2026 году — 20–28% годовых. Это выглядит высоко, но соответствует инфляции и рыночным ставкам в Узбекистане. Важно: эта ставка за длинный срок (10–20 лет) превращается в крупную сумму, поэтому каждый процент важен.</p><h2>Льготные ипотечные программы</h2><p>Государство даёт некоторым категориям ипотеку под низкий процент:</p><ul><li><strong>Молодёжная ипотека</strong> — низкая ставка и удобные условия для молодых семей.</li><li><strong>Многодетные семьи</strong> — субсидии и низкий процент.</li><li><strong>Госслужащие</strong> — специальные программы для учителей, врачей и других.</li></ul><p>Льготная ставка может быть 7–14% — почти вдвое ниже обычной. Если подходите под эти категории, обязательно воспользуйтесь.</p><h2>Как рассчитать ежемесячный платёж?</h2><p>Платёж зависит от четырёх вещей: цена жилья, первоначальный взнос, ставка и срок. Например, на жильё за 500 млн сум с взносом 20% (100 млн), под льготные 15%, на 15 лет — платёж составит примерно 5,6 млн сум.</p><div class=\"cta-calc\"><div class=\"t\">Сделайте свой расчёт</div><div class=\"d\">Введите цену жилья, взнос и ставку — и увидите платёж.</div><a href=\"ipoteka-kalkulyator\">Ипотечный калькулятор →</a></div><h2>На что обратить внимание перед ипотекой?</h2><p>Первое — проверьте, что платёж не превышает 40% дохода. Второе — страховка (жилья и жизни) при ипотеке обязательна, учтите её. Третье — сравните несколько банков, ставки и условия различаются. Четвёртое — узнайте о возможности и штрафах досрочного погашения.</p><div class=\"disclaimer\">Статья для общего ознакомления. За точными ставками и условиями обращайтесь в банки. Цифры примерны по состоянию на 2026 год.</div>", "faq": [{"q": "Какая зарплата нужна для ипотеки?", "a": "Банк обычно требует, чтобы платёж не превышал 50% дохода. Например, для платежа 5 млн сум нужен официальный доход минимум 10 млн сум. Точное требование зависит от банка."}, {"q": "Можно ли погасить ипотеку досрочно?", "a": "Да, чаще всего можно, это экономит оставшиеся проценты. Но некоторые банки берут штраф за досрочное погашение — проверьте договор заранее."}, {"q": "Есть ли ипотека без первоначального взноса?", "a": "В некоторых льготных госпрограммах взнос может быть низким или нулевым. В обычной коммерческой ипотеке требуется 15-25%."}, {"q": "Можно ли продать ипотечное жильё?", "a": "Жильё в ипотеке находится в залоге, для продажи нужно согласие банка. Обычно сначала гасят остаток долга, затем продают, либо переводят долг на покупателя."}]}};
  var UI={uz:{back:'← Barcha maqolalar',home:'Bosh sahifa',date:'20-iyul, 2026'},ru:{back:'← Все статьи',home:'Главная',date:'20 июля 2026'}};

    for(var i=0;i<fq.length;i++){faqHtml+='<div style="border-bottom:1px solid #E3E9E4;padding:12px 0"><div style="font-weight:800;font-size:15px;margin-bottom:5px">'+fq[i].q+'</div><div style="font-size:14px;color:#33403A">'+fq[i].a+'</div></div>';}
    document.getElementById('artBody').innerHTML+=faqHtml;
    document.getElementById('backBlog').textContent=UI[lang].back;
    document.getElementById('backHome').textContent=UI[lang].home;
    document.getElementById('langUz').classList.toggle('on',lang==='uz');
    document.getElementById('langRu').classList.toggle('on',lang==='ru');
    buildSchema();
  }
  function buildSchema(){
    var old=document.getElementById('art-ld');if(old)old.remove();
    var s=document.createElement('script');s.type='application/ld+json';s.id='art-ld';
    s.textContent=JSON.stringify({"@context":"https://schema.org","@type":"Article",
      "headline":DATA[lang].title,"datePublished":"2026-07-20","inLanguage":lang,
      "author":{"@type":"Organization","name":"Kalki.uz"},
      "publisher":{"@type":"Organization","name":"Kalki.uz"}});
    document.head.appendChild(s);
    var fq2=DATA[lang].faq||[];
    if(fq2.length){
      var oldF=document.getElementById('art-faq-ld');if(oldF)oldF.remove();
      var sf=document.createElement('script');sf.type='application/ld+json';sf.id='art-faq-ld';
      sf.textContent=JSON.stringify({"@context":"https://schema.org","@type":"FAQPage","mainEntity":fq2.map(function(x){return{"@type":"Question","name":x.q,"acceptedAnswer":{"@type":"Answer","text":x.a}};})});
      document.head.appendChild(sf);
    }
  }
  document.getElementById('langUz').onclick=function(){lang='uz';render()};
  document.getElementById('langRu').onclick=function(){lang='ru';render()};
  render();
})();
</script>
