<!doctype html>
<html lang="uz"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Internet aloqasi yo'q — Kalki.uz</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
/* Tashqi shrift va rasm YO'Q: bu sahifa aynan tarmoq yo'q paytda ochiladi,
   ya'ni yuklanmaydigan har bir resurs — bo'sh joy va kutish demak.
   Ranglar dizayn tokenlari bilan bir xil (assets/css/tokens.css), lekin shu yerda inline. */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#F1F2EE;color:#1A2822;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border:1px solid #DDE5E0;border-radius:12px;padding:32px 24px;max-width:440px;width:100%;
  box-shadow:0 1px 2px rgba(0,0,0,.04)}
.brand{font-size:22px;font-weight:800;color:#0E3B2E;margin-bottom:24px}
.brand span{color:#855807}
.sign{width:48px;height:48px;border-radius:12px;background:#E8F2EC;color:#1E6B45;
  display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.sign svg{width:26px;height:26px}
h1{font-size:24px;line-height:1.3;margin:0 0 12px;color:#0E3B2E}
p{margin:0 0 8px;font-size:16px;color:#526459}
.acts{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap}
button,.home{flex:1 1 auto;min-height:48px;display:flex;align-items:center;justify-content:center;
  border-radius:10px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;padding:12px 16px}
button{background:#1E6B45;color:#fff;border:0}
button:hover{background:#17583A}
.home{background:#fff;color:#0E3B2E;border:1.5px solid #C6D2CB}
.langs{margin-top:24px;display:flex;gap:6px}
.langs button{flex:0 0 auto;min-height:44px;padding:8px 16px;font-size:14px;background:#F1F2EE;color:#1A2822;border-radius:10px}
.langs button[aria-pressed="true"]{background:#0E3B2E;color:#fff}
:focus-visible{outline:3px solid #D99A2B;outline-offset:2px}
</style>
</head><body>
<main class="card">
  <div class="brand">Kalki<span>.uz</span></div>
  <div class="sign" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg></div>
  <h1 id="t">Internet aloqasi yo'q</h1>
  <p id="p1">Qurilma tarmoqqa ulanmagan, shuning uchun bu sahifani ochib bo'lmadi.</p>
  <p id="p2">Ilgari ochilgan sahifalar oflaynda ham ishlashda davom etadi — ularni brauzer tarixidan oching.</p>
  <div class="acts">
    <button type="button" id="retry">Qayta urinish</button>
    <a class="home" href="/" id="home">Bosh sahifa</a>
  </div>
  <div class="langs">
    <button type="button" id="langUz" aria-pressed="true">UZ</button>
    <button type="button" id="langRu" aria-pressed="false">RU</button>
  </div>
</main>
<script>
(function(w,d){
  var T={
    uz:{title:"Internet aloqasi yo'q — Kalki.uz",t:"Internet aloqasi yo'q",
      p1:"Qurilma tarmoqqa ulanmagan, shuning uchun bu sahifani ochib bo'lmadi.",
      p2:"Ilgari ochilgan sahifalar oflaynda ham ishlashda davom etadi — ularni brauzer tarixidan oching.",
      retry:"Qayta urinish",home:"Bosh sahifa"},
    ru:{title:"Нет подключения к интернету — Kalki.uz",t:"Нет подключения к интернету",
      p1:"Устройство не подключено к сети, поэтому страницу не удалось открыть.",
      p2:"Ранее открытые страницы продолжают работать и офлайн — откройте их из истории браузера.",
      retry:"Повторить",home:"Главная"}
  };
  function apply(l){
    var x=T[l]||T.uz;
    d.documentElement.lang=l;
    d.title=x.title;
    d.getElementById('t').textContent=x.t;
    d.getElementById('p1').textContent=x.p1;
    d.getElementById('p2').textContent=x.p2;
    d.getElementById('retry').textContent=x.retry;
    d.getElementById('home').textContent=x.home;
    d.getElementById('langUz').setAttribute('aria-pressed',String(l==='uz'));
    d.getElementById('langRu').setAttribute('aria-pressed',String(l==='ru'));
  }
  function stored(){
    try{
      var s=localStorage.getItem('kalki_lang')||localStorage.getItem('lang')||localStorage.getItem('siteLang');
      if(s==='ru'||s==='uz')return s;
    }catch(e){}
    return 'uz';
  }
  function pick(l){
    try{localStorage.setItem('kalki_lang',l)}catch(e){}
    apply(l);
  }
  d.getElementById('langUz').onclick=function(){pick('uz')};
  d.getElementById('langRu').onclick=function(){pick('ru')};
  d.getElementById('retry').onclick=function(){w.location.reload()};
  apply(stored());
})(window,document);
</script>
</body></html>
