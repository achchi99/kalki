  var DATA={"uz": {"tag": "Avto", "title": "Avtomobil import qilish: 2026-yil bojxona to’lovlari", "body": "<p>Chetdan avtomobil olib kelish — ko’pchilik uchun jozibador, lekin bojxona to’lovlari qo’shimcha katta xarajat. 2026-yilda bu to’lovlar qanday hisoblanadi va qanday tejash mumkin — ko’rib chiqamiz.</p><h2>Bojxona to’lovi nimalardan iborat?</h2><p>Avtomobil bojxona to’lovi asosan uch qismdan iborat:</p><ul><li><strong>Bojxona boji</strong> — mashina qiymati va turiga qarab.</li><li><strong>Aksiz solig’i</strong> — dvigatel hajmi va yoshiga bog’liq.</li><li><strong>QQS</strong> — qo’shilgan qiymat solig’i.</li></ul><p>Bu uch qism yig’ilib, umumiy to’lovni tashkil qiladi. Mashina qanchalik eski va katta hajmli bo’lsa, to’lov shuncha yuqori.</p><h2>Elektromobil imtiyozları</h2><p>2026-yilda O’zbekiston elektromobillarni faol rag’batlantiradi: ular uchun bojxona boji va aksiz <strong>0%</strong>. Faqat QQS va ba’zi yig’imlar qoladi. Ya’ni elektromobil import qilish benzinli mashinaga nisbatan ancha arzon. Bu ekologiya va tejash uchun yaxshi imkoniyat.</p><div class=\"cta-calc\"><div class=\"t\">Bojni oldindan hisoblang</div><div class=\"d\">Mashina qiymati, hajmi va yoshini kiritib, taxminiy to’lovni ko’ring.</div><a href=\"bojxona-kalkulyator\">Bojxona kalkulyatori →</a></div><h2>Qanday hujjatlar kerak?</h2><p>Rasmiylashtirish uchun: mashina invoysi, texnik pasport, kelib chiqish sertifikati, xarid shartnomasi va bojxona deklaratsiyasi kerak. Hujjatlar to’liq va to’g’ri bo’lsa, rasmiylashtirish tez kechadi. Kalkulyator ostida to’liq ro’yxat berilgan.</p><h2>Qanday tejash mumkin?</h2><p>Qonuniy yo’llar: elektromobil yoki gibrid tanlash (katta imtiyoz), kichikroq dvigatel hajmi, yangiroq mashina olish. Muhimi — mashina olishdan <strong>oldin</strong> bojni hisoblab, umumiy xarajatni bilib olish. Aks holda kutilmagan katta to’lov chiqishi mumkin.</p><div class=\"disclaimer\">Maqola umumiy ma’lumot uchun. Aniq to’lov bojxona postida, joriy kurs va me’yorlar asosida aniqlanadi.</div>", "faq": [{"q": "Elektromobilga bojxona to'lovi bormi?", "a": "2026-yilda O'zbekistonda elektromobillar uchun bojxona boji va aksiz 0%. Faqat QQS va ba'zi yig'imlar qoladi, shuning uchun ular ancha arzon rasmiylashtiriladi."}, {"q": "Rastamojka necha kun davom etadi?", "a": "Hujjatlar to'liq bo'lsa, rasmiylashtirish odatda bir necha kun ichida yakunlanadi. Hujjat yetishmasa yoki baholashda nizo bo'lsa, muddat cho'ziladi."}, {"q": "Mashinani o'zim rasmiylashtira olamanmi?", "a": "Ha, o'zingiz qila olasiz, lekin ko'pchilik broker yoki deklarant xizmatidan foydalanadi — bu vaqt va xatolarni tejaydi. Broker haqi alohida to'lanadi."}, {"q": "Bojxona qiymati qanday aniqlanadi?", "a": "Bojxona mashinaning bozor qiymatini invoys, yoshi, hajmi va rasmiy bazaga qarab belgilaydi. Agar e'lon qilingan qiymat past bo'lsa, bojxona o'z bahosini qo'llashi mumkin."}]}, "ru": {"tag": "Авто", "title": "Импорт авто: таможенные платежи в 2026", "body": "<p>Ввоз автомобиля из-за рубежа привлекателен для многих, но таможенные платежи — крупная доп. трата. Как эти платежи считаются в 2026 году и как сэкономить — разберём.</p><h2>Из чего состоит таможенный платёж?</h2><p>Таможенный платёж за авто состоит в основном из трёх частей:</p><ul><li><strong>Таможенная пошлина</strong> — по стоимости и типу машины.</li><li><strong>Акциз</strong> — зависит от объёма двигателя и возраста.</li><li><strong>НДС</strong> — налог на добавленную стоимость.</li></ul><p>Эти три части складываются в общий платёж. Чем старше и больше по объёму машина, тем выше платёж.</p><h2>Льготы на электромобили</h2><p>В 2026 году Узбекистан активно стимулирует электромобили: для них пошлина и акциз <strong>0%</strong>. Остаются только НДС и некоторые сборы. То есть импорт электромобиля намного дешевле бензиновой машины. Это хорошая возможность для экологии и экономии.</p><div class=\"cta-calc\"><div class=\"t\">Посчитайте пошлину заранее</div><div class=\"d\">Введите стоимость, объём и возраст машины — увидите примерный платёж.</div><a href=\"bojxona-kalkulyator\">Калькулятор растаможки →</a></div><h2>Какие документы нужны?</h2><p>Для оформления нужны: инвойс, техпаспорт, сертификат происхождения, договор покупки и таможенная декларация. С полным и правильным пакетом оформление проходит быстро. Полный список дан под калькулятором.</p><h2>Как сэкономить?</h2><p>Законные способы: выбрать электромобиль или гибрид (большая льгота), меньший объём двигателя, более новую машину. Важно — посчитать пошлину <strong>до</strong> покупки и знать общие расходы. Иначе может возникнуть неожиданный крупный платёж.</p><div class=\"disclaimer\">Статья для общего ознакомления. Точный платёж определяется на таможенном посту по текущему курсу и нормам.</div>", "faq": [{"q": "Есть ли пошлина на электромобиль?", "a": "В 2026 году в Узбекистане для электромобилей пошлина и акциз 0%. Остаются только НДС и некоторые сборы, поэтому они растамаживаются намного дешевле."}, {"q": "Сколько дней длится растаможка?", "a": "При полном пакете документов оформление обычно завершается за несколько дней. При нехватке документов или споре по оценке срок увеличивается."}, {"q": "Могу ли я растаможить машину сам?", "a": "Да, можно самому, но многие пользуются услугами брокера или декларанта — это экономит время и снижает риск ошибок. Услуга брокера оплачивается отдельно."}, {"q": "Как определяется таможенная стоимость?", "a": "Таможня определяет рыночную стоимость по инвойсу, возрасту, объёму и официальной базе. Если заявленная стоимость занижена, таможня может применить свою оценку."}]}};
