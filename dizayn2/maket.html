<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>KalkiFit dizayn 2 — maket</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== KalkiFit dizayn 2 — MAKET (ilovaga ulanmagan). Tokenlar bitta joyda. ===== */
.m{--bg:#F7F5F2;--surf:#FFFFFF;--surf2:#F1EEE9;--line:#E7E2DB;--text:#1F2125;--sub:#5E6470;--sub2:#8A909A;--acc:#E8572F;--onacc:#FFFFFF;--accsoft:#FDEDE7;--acctext:#C2441F;
  --p:#5B8DEF;--f:#F2B33D;--c:#3DBE8B;--w:#4FA9E8;--shadow:0 1px 2px rgba(31,33,37,.06),0 4px 16px rgba(31,33,37,.05);--scrim:rgba(31,33,37,.42);--track:#ECE8E1}
.m[data-th=dark]{--bg:#18191C;--surf:#212327;--surf2:#2A2C31;--line:#34373D;--text:#E9E7E3;--sub:#ABA7A0;--sub2:#7F7C76;--acc:#FF7E5C;--onacc:#1C0C06;--accsoft:rgba(255,126,92,.15);--acctext:#FF9A7E;
  --p:color-mix(in srgb,#5B8DEF 90%,#18191C);--f:color-mix(in srgb,#F2B33D 90%,#18191C);--c:color-mix(in srgb,#3DBE8B 90%,#18191C);--w:color-mix(in srgb,#4FA9E8 90%,#18191C);--shadow:none;--scrim:rgba(0,0,0,.55);--track:#2A2C31}
/* AA-tavsiya variant: faqat spetsifikatsiyadagi AA/≤13:1 chegaralarini buzgan 4 ta qiymat */
.m[data-tok=aa]{--onacc:#1C0C06;--sub2:#676C73;--acctext:#B93F1D}
.m[data-th=dark][data-tok=aa]{--text:#DEDCD8;--sub2:#96938D;--acctext:#FF9A7E}
*{box-sizing:border-box;margin:0}
html,body{background:#888}
body{font-family:'Manrope',system-ui,-apple-system,sans-serif}
.m{width:390px;margin:0 auto;background:var(--bg);color:var(--text);font-size:17px;line-height:1.45;font-weight:400;position:relative;min-height:100vh;-webkit-font-smoothing:antialiased}
.m.big{font-size:19px}
.m :where(button){font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left;padding:0}
.m svg{display:block}.cta svg,.plus svg,.fab svg,.qty .b svg,.nav .ic svg{width:24px;height:24px;flex:none}.ibtn svg{width:22px;height:22px}
/* tipografiya */
.t-scr{font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.01em}.t-sec{font-size:20px;line-height:1.3;font-weight:600}.t-card{font-size:17px;font-weight:600}.t-2{font-size:15px;line-height:1.4}.t-1{font-size:13px;line-height:1.3;font-weight:500}
.sub{color:var(--sub)}.sub2{color:var(--sub2)}.num{font-variant-numeric:tabular-nums}
.pad{padding:0 20px}.gap{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surf);border-radius:20px;padding:18px 20px;box-shadow:var(--shadow)}
.sech{display:flex;align-items:baseline;justify-content:space-between;margin:24px 20px 12px}.sech a{font-size:15px;color:var(--acctext);font-weight:600}
/* yuqori */
.top{display:flex;align-items:flex-end;justify-content:space-between;padding:22px 20px 12px}
.top .d{font-size:15px;color:var(--sub);font-weight:500}
.ibtn{width:44px;height:44px;border-radius:50%;background:var(--surf);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--sub)}
.m[data-th=dark] .ibtn{background:var(--surf2)}
.streak{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:20px;background:var(--surf);box-shadow:var(--shadow);font-size:15px;color:var(--sub)}.streak b{color:var(--text);font-weight:700}.streak svg{width:18px;height:18px;color:var(--acc)}.m[data-th=dark] .streak{background:var(--surf2)}
/* hafta qatori */
.week{display:flex;gap:6px;padding:4px 20px 4px;justify-content:space-between}
.day{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 10px;border-radius:16px;color:var(--sub)}
.day b{font-size:17px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}.day .t-1{color:var(--sub)}
.day i{width:6px;height:6px;border-radius:50%;background:var(--line)}.day i.ok{background:var(--c)}.day i.hi{background:var(--f)}.day i.lo{background:var(--w)}
.day.on{background:var(--acc);color:var(--onacc)}.day.on b,.day.on .t-1{color:var(--onacc)}.day.on i{background:var(--onacc);opacity:.6}
/* doira */
.ringc{padding:20px 20px 18px;text-align:center}
.ringw{position:relative;width:236px;height:236px;margin:2px auto 14px}
.ringw svg{position:absolute;inset:0}
.ringw .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.ringw .big{font-size:52px;line-height:1.05;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ringw .lbl{font-size:15px;color:var(--sub);margin-top:2px}
.ringsub{display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;color:var(--sub);font-variant-numeric:tabular-nums}
.ringsub b{color:var(--text);font-weight:600}
.info{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--sub2);color:var(--sub);display:inline-grid;place-items:center;font-size:14px;font-weight:600;line-height:1;flex:none}
.joke{padding:12px 24px 0;font-size:15px;color:var(--sub);text-align:center;line-height:1.45}
/* katta tugma */
.cta{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:18px;background:var(--acc);color:var(--onacc)!important;font-size:18px;font-weight:600;width:calc(100% - 40px);margin:16px 20px 0;box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 28%,transparent)}
.m[data-th=dark] .cta{box-shadow:none}
.cta.in{width:100%;margin:0}
/* makrolar */
.macs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.mac .n{font-size:15px;color:var(--sub);display:flex;align-items:center;gap:6px}.mac .n i{width:8px;height:8px;border-radius:50%}
.mac .v{font-size:17px;font-weight:600;margin:3px 0 8px;font-variant-numeric:tabular-nums;white-space:nowrap}.mac .v small{font-size:15px;font-weight:400;color:var(--sub)}
.bar{height:5px;border-radius:3px;background:var(--track);overflow:hidden}.bar i{display:block;height:100%;border-radius:3px}
/* ovqat kartalari */
.meal{display:flex;align-items:center;gap:14px;padding:14px 16px 14px 14px}
.tile{width:48px;height:48px;border-radius:14px;background:var(--surf2);flex:none;overflow:hidden;display:grid;place-items:center;font-weight:700;color:var(--acctext)}
.tile img{width:100%;height:100%;object-fit:cover}
.meal .m1{flex:1;min-width:0}.meal .m1 .t-card{display:flex;justify-content:space-between;gap:8px}.meal .m1 .t-card span{color:var(--text)}
.meal .m1 .t-2{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.meal .add{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:14px;border:1.5px dashed var(--line);color:var(--acctext);font-size:15px;font-weight:600;flex:none}
.m[data-th=dark] .meal .add{border-color:var(--sub2)}
.hint{font-size:13px;color:var(--sub);text-align:center;margin-top:10px}
/* suv + qadam */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.duo .card{padding:16px}.duo .k{font-size:15px;color:var(--sub);display:flex;align-items:center;gap:6px}.duo .v{font-size:22px;font-weight:600;margin:4px 0 10px;font-variant-numeric:tabular-nums}.duo .v small{font-size:15px;font-weight:400;color:var(--sub)}
.pill{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 14px;border-radius:14px;background:var(--accsoft);color:var(--acctext);font-size:15px;font-weight:600}
.pill.w{background:color-mix(in srgb,var(--w) 16%,transparent);color:var(--text)}
/* nav + fab */
.nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surf);padding:8px 12px 22px;margin-top:28px;box-shadow:0 -1px 0 var(--line)}
.m:not([data-th=dark]) .nav{box-shadow:0 -4px 20px rgba(31,33,37,.06)}
.nav .it{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--sub);font-size:13px;font-weight:600;border-radius:14px}
.nav .it svg{width:26px;height:26px}.nav .it.on{color:var(--acctext)}
.nav .it.on .ic{background:var(--accsoft);border-radius:14px;padding:4px 18px;display:grid;place-items:center}.nav .it .ic{padding:4px 18px;display:grid;place-items:center}
.fab{position:sticky;bottom:96px;float:right;margin:-70px 20px 0 0;width:56px;height:56px;border-radius:18px;background:var(--acc);color:var(--onacc);display:grid;place-items:center;box-shadow:0 8px 20px color-mix(in srgb,var(--acc) 30%,transparent);z-index:3}
.m[data-th=dark] .fab{box-shadow:0 6px 16px rgba(0,0,0,.4)}
/* sheet */
.frame{height:844px;overflow:hidden;position:relative}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;top:36px;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 0 0;overflow:hidden;display:flex;flex-direction:column}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}.m[data-th=dark] .grab{background:#4A4D54}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:2px 20px 10px}
.seg{display:flex;background:var(--surf2);border-radius:16px;padding:4px;margin:0 20px}.seg button{flex:1;text-align:center;padding:10px 0;border-radius:12px;font-size:15px;font-weight:600;color:var(--sub)}.seg button.on{background:var(--surf);color:var(--text);box-shadow:var(--shadow)}
.m[data-th=dark] .seg button.on{background:var(--line);color:var(--text);box-shadow:none}
.search{display:flex;align-items:center;gap:12px;margin:14px 20px 8px;height:54px;border-radius:16px;background:var(--surf);box-shadow:var(--shadow);padding:0 16px;color:var(--sub)}.m[data-th=dark] .search{background:var(--surf2)}
.search span{font-size:17px;color:var(--sub)}
.ai{display:flex;align-items:center;gap:8px;margin:0 22px 12px;font-size:15px;color:var(--sub)}
.chips{display:flex;gap:8px;padding:0 20px 14px;overflow:hidden}.chip{flex:none;height:40px;display:inline-flex;align-items:center;padding:0 16px;border-radius:20px;background:var(--surf);color:var(--text);font-size:15px;font-weight:500;box-shadow:var(--shadow)}.m[data-th=dark] .chip{background:var(--surf2)}
.chip.on{background:var(--acc);color:var(--onacc);font-weight:600}
.rows{padding:0 20px}.row{display:flex;align-items:center;gap:14px;padding:11px 0}.row+.row{border-top:1px solid var(--line)}
.row .m1{flex:1;min-width:0}.row .m1 .t-card{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .m1 .t-2{color:var(--sub)}
.row .plus{width:44px;height:44px;border-radius:14px;background:var(--accsoft);color:var(--acctext);display:grid;place-items:center;flex:none}
.sl-h{font-size:17px;font-weight:600;margin:6px 20px 4px}
/* porsiya */
.por{padding:0 20px;overflow:hidden;flex:1;display:flex;flex-direction:column}
.por .hero{display:flex;flex-direction:column;align-items:center;gap:3px;margin:0 0 4px;text-align:center}.por .hero .tile{width:84px;height:84px;border-radius:24px}
.por .hero h2{font-size:24px;font-weight:700;line-height:1.2}.por .kc{font-size:36px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:2px}.por .kc small{font-size:17px;font-weight:500;color:var(--sub)}
.por .macs{margin:10px 0 2px}
.qty{display:flex;align-items:center;justify-content:space-between;background:var(--surf);border-radius:20px;padding:8px;box-shadow:var(--shadow);margin-top:10px}.m[data-th=dark] .qty{background:var(--surf2)}
.qty .b{width:52px;height:52px;border-radius:16px;background:var(--surf2);display:grid;place-items:center;color:var(--text)}.m[data-th=dark] .qty .b{background:var(--surf)}
.qty .c{text-align:center}.qty .c b{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}.qty .c b small{font-size:17px;font-weight:500;color:var(--sub);margin-left:4px}.qty .c div{font-size:15px;color:var(--sub)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.quick button{text-align:center;height:42px;border-radius:14px;background:var(--surf);box-shadow:var(--shadow);font-size:17px;font-weight:600}.m[data-th=dark] .quick button{background:var(--surf2)}
.quick button.on{background:var(--accsoft);color:var(--acctext)}
.typ{display:flex;align-items:center;justify-content:space-between;margin-top:6px;padding:8px 0 0}.typ .a{color:var(--acctext);font-weight:600;font-size:15px}
.orn{display:flex;align-items:center;gap:10px;background:var(--surf);border-radius:16px;padding:12px 14px;margin-top:10px;box-shadow:inset 3px 0 0 var(--acc),var(--shadow)}.m[data-th=dark] .orn{background:var(--surf2);box-shadow:inset 3px 0 0 var(--acc)}
.orn .m1{flex:1}.orn .m1 .t-1{color:var(--sub)}.orn .m1 .t-card{font-size:17px}.orn .m1 .t-2{color:var(--sub)}
.cta-bar{padding:12px 20px 26px;background:var(--bg);margin-top:auto}
/* tarix / profil */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.sum b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}.sum span{font-size:15px;color:var(--sub)}
.drow{display:flex;align-items:center;gap:14px;padding:12px 0}.drow+.drow{border-top:1px solid var(--line)}.drow .dt{width:44px;text-align:center}.drow .dt b{display:block;font-size:20px;font-weight:600;line-height:1.1}.drow .dt span{font-size:13px;color:var(--sub);font-weight:500}
.drow .m1{flex:1}.drow .m1 .bar{margin-top:8px}.drow .k{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.st{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--sub)}.st i{width:8px;height:8px;border-radius:50%;background:var(--c)}.st i.hi{background:var(--f)}
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px;margin:12px 0 10px}.stack i{display:block;min-width:6px}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:15px;color:var(--sub);list-style:none;padding:0}.leg li{display:inline-flex;align-items:center;gap:6px}.leg i{width:10px;height:10px;border-radius:3px}.leg b{color:var(--text);font-weight:600}
.steps{display:flex;align-items:flex-end;gap:8px;height:84px;margin-top:10px}.steps i{flex:1;border-radius:8px 8px 4px 4px;background:var(--track)}.steps i.on{background:var(--c)}
.lrow{display:flex;align-items:center;gap:14px;padding:14px 0;min-height:60px}.lrow+.lrow{border-top:1px solid var(--line)}.lrow .ic{width:40px;height:40px;border-radius:12px;background:var(--accsoft);color:var(--acctext);display:grid;place-items:center;flex:none}
.lrow .m1{flex:1}.lrow .m1 .t-2{color:var(--sub)}
.pg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}.pg small{display:block;font-size:13px;color:var(--sub);font-weight:500}.pg b{font-size:20px;font-weight:600}
.tgt{display:flex;justify-content:space-between;align-items:center;margin:14px 0 12px;padding-top:14px;border-top:1px solid var(--line)}
.ghost{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:16px;background:var(--surf2);font-size:17px;font-weight:600;width:100%;text-align:center}
.seg3{margin:0}.lab{font-size:15px;font-weight:600;color:var(--text);margin:14px 0 8px;display:block}
.note{font-size:15px;color:var(--sub);margin-top:8px}
body.shot .nav{position:static}body.shot .fab{position:relative;bottom:auto;float:right;margin:-76px 20px 0 0}
/* ko'rish paneli (faqat sahifa o'zida, ?shot=1 da yo'q) */
.vw{position:sticky;top:0;z-index:20;background:rgba(40,40,40,.92);color:#fff;display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;font:600 13px 'Manrope',sans-serif;width:390px;margin:0 auto}
.vw button{color:#fff;background:#555;border-radius:10px;padding:6px 10px}.vw button.on{background:#E8572F}
</style>
</head>

<div id="vw" class="vw"></div>
<div id="app" class="m" data-th="light"></div>
<script>
var IC={

var NAMES={bugun:'Bugun (to\'la kun)',bosh:'Bugun (bo\'sh kun)',qosh:'Ovqat qo\'shish',porsiya:'Porsiya',tarix:'Tarix',profil:'Profil'};
var q=new URLSearchParams(location.search),el=document.getElementById('app'),vw=document.getElementById('vw');
var st={e:q.get('ekran')||'bugun',t:q.get('tema')||'light',tok:q.get('tok')||'spec',big:q.get('katta')==='1'};
