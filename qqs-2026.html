<style>
:root{--cat:#1A2B24;--accent:#D99A2B;--cat-text:#C9D6CE;--paper:#F7F8F6;--card:#FFFFFF;--ink:#16211C;--muted:#5C6B63;--line:#DDE5E0;--radius:14px}

html{-webkit-text-size-adjust:100%}
body{font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--paper);color:var(--ink);line-height:1.65;min-height:100vh}

header .wrap{padding-bottom:0}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--cat-text);text-decoration:none}

.lang-seg{display:flex;background:rgba(255,255,255,.14);border-radius:9px;padding:3px;gap:3px}
.lang-seg button{border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:800;color:var(--cat-text);padding:6px 12px;border-radius:7px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.lang-seg button.on{background:#fff;color:var(--cat)}
.tag{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:8px}
h1{font-size:24px;font-weight:800;line-height:1.25}
.meta{margin-top:10px;font-size:12.5px;color:var(--cat-text);font-weight:600}
main{padding-top:24px;font-size:15.5px}
main h2{font-size:19px;font-weight:800;margin:26px 0 10px}
main p{margin-bottom:12px}
main ul{margin:0 0 12px 22px}
main li{margin-bottom:7px}
main strong{font-weight:800}
.cta-calc{margin:24px 0;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:16px 18px}
.cta-calc .t{font-weight:800;font-size:15px;margin-bottom:4px}
.cta-calc .d{font-size:13.5px;color:var(--muted);margin-bottom:12px}
.cta-calc a{display:inline-block;background:var(--cat);color:#fff;font-weight:800;font-size:14px;padding:10px 18px;border-radius:9px;text-decoration:none}
.disclaimer{margin-top:24px;background:#EEF2EF;border-radius:10px;padding:13px 15px;font-size:12.5px;color:var(--muted);line-height:1.5}
footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
footer a{color:var(--muted);text-decoration:none}

<script>
(function(){
  var DATA={"uz": {"tag": "Biznes", "title": "QQS 2026: qanday hisoblanadi va kim to'laydi", "body": "<p>Qoshilgan qiymat soligi (QQS) — Ozbekistonda eng kop uchraydigan soliqlardan biri. Tadbirkorlar, buxgalterlar va oddiy xaridorlar ham u bilan tez-tez duch keladi. QQS qanday ishlaydi, stavkasi qancha va kim tolashi kerak — tushuntiramiz.</p><h2>QQS stavkasi qancha?</h2><p>2026-yilda Ozbekistonda asosiy QQS stavkasi 12%. Bu tovar yoki xizmat narxiga qoshiladi. Bazi ijtimoiy muhim tovarlar (bazi oziq-ovqat, dori) QQSdan ozod yoki past stavkada bolishi mumkin.</p><h2>QQSni kim tolaydi?</h2><p>Rasman QQSni biznes davlatga tolaydi, lekin amalda uni oxirgi xaridor koradi — chunki u narxga qoshilgan. Yillik aylanmasi belgilangan chegaradan oshgan tashkilotlar QQS tolovchisi bolishi shart. Kichik biznes soddalashtirilgan tartibda ishlashi mumkin.</p><h2>QQS qanday hisoblanadi?</h2><p>Agar tovar narxi 100 000 som bolsa va QQS 12% bolsa, QQS summasi 12 000 som, umumiy narx 112 000 som. Aksincha, 112 000 som QQSli narxdan QQSni ajratish uchun: 112 000 / 1.12 = 100 000 som (sof narx), qolgan 12 000 — QQS.</p><div class=\"cta-calc\"><div class=\"t\">QQSni tez hisoblang</div><div class=\"d\">Narxni kiriting — QQS summasi va umumiy narx avtomatik chiqadi.</div><a href=\"qqs-kalkulyator\">QQS kalkulyatori →</a></div><h2>Kirim va chiqim QQS nima?</h2><p>Biznes sotganda QQS oladi (chiqim QQS), sotib olganda QQS tolaydi (kirim QQS). Davlatga tolanadigan summa — shu ikkisining farqi. Shuning uchun QQS tolovchi biznes uchun hujjatlar (faktura) muhim.</p><h2>QQSdan qanday ozod bolinadi?</h2><p>Yillik aylanmasi belgilangan chegaradan past bolsa yoki maxsus soliq rejimida (masalan aylanma soligi) ishlasa, biznes QQS tolamasligi mumkin. Bu holatda QQS ham qoshilmaydi. Aniq shartlar uchun soliq maslahatchisiga murojaat qiling.</p><div class=\"disclaimer\">Maqola umumiy malumot uchun. Aniq stavka va shartlar uchun Soliq qomitasi rasmiy manbalarini yoki buxgalterni tekshiring.</div>", "faq": [{"q": "QQS 12% hamma tovarga bir xilmi?", "a": "Kop tovar va xizmatga 12%, lekin bazi ijtimoiy muhim tovarlar (bazi oziq-ovqat, dori, talim) QQSdan ozod yoki imtiyozli. Aniq royxat qonunda belgilangan."}, {"q": "Jismoniy shaxs QQS tolaydimi?", "a": "Bevosita yoq, lekin har xaridda narxga qoshilgan QQSni tolaydi. QQS tolovchi bolib royxatdan otish faqat biznes uchun."}, {"q": "QQSni qaytarib olish mumkinmi?", "a": "QQS tolovchi biznes kirim QQSni chiqim QQSdan ayirib, farqini tolaydi. Agar kirim koproq bolsa, ortiqcha summa qaytarilishi yoki keyingi davrga otkazilishi mumkin."}, {"q": "QQSsiz ishlash mumkinmi?", "a": "Ha, aylanmasi chegaradan past kichik biznes yoki maxsus rejimdagilar QQSsiz ishlaydi. Bunda mijozga QQS qoshilmaydi, lekin kirim QQS ham qaytarilmaydi."}]}, "ru": {"tag": "Бизнес", "title": "НДС 2026: как считается и кто платит", "body": "<p>Налог на добавленную стоимость (НДС) — один из самых распространённых налогов в Узбекистане. С ним часто сталкиваются предприниматели, бухгалтеры и обычные покупатели. Как работает НДС, какая ставка и кто должен платить — объясняем.</p><h2>Какая ставка НДС?</h2><p>В 2026 году основная ставка НДС в Узбекистане — 12%. Она добавляется к цене товара или услуги. Некоторые социально важные товары (часть продуктов, лекарства) могут быть освобождены или по льготной ставке.</p><h2>Кто платит НДС?</h2><p>Формально НДС платит бизнес государству, но фактически его несёт конечный покупатель — ведь он добавлен к цене. Организации с годовым оборотом выше порога обязаны быть плательщиками НДС. Малый бизнес может работать по упрощёнке.</p><h2>Как считается НДС?</h2><p>Если цена товара 100 000 сум и НДС 12%, то сумма НДС 12 000 сум, общая цена 112 000 сум. Наоборот, чтобы выделить НДС из цены с НДС 112 000: 112 000 / 1.12 = 100 000 сум (чистая цена), остальные 12 000 — НДС.</p><div class=\"cta-calc\"><div class=\"t\">Быстро посчитайте НДС</div><div class=\"d\">Введите цену — сумма НДС и общая цена появятся автоматически.</div><a href=\"qqs-kalkulyator\">Калькулятор НДС →</a></div><h2>Что такое входящий и исходящий НДС?</h2><p>При продаже бизнес получает НДС (исходящий), при покупке платит НДС (входящий). Государству платится разница между ними. Поэтому для плательщика НДС важны документы (счёт-фактура).</p><h2>Как освободиться от НДС?</h2><p>Если годовой оборот ниже порога или бизнес на специальном налоговом режиме (например, налог с оборота), он может не платить НДС. В этом случае НДС и не добавляется. За точными условиями обратитесь к налоговому консультанту.</p><div class=\"disclaimer\">Статья для общего ознакомления. За точными ставками и условиями проверяйте официальные источники Налогового комитета или бухгалтера.</div>", "faq": [{"q": "НДС 12% одинаков для всех товаров?", "a": "Для большинства товаров и услуг 12%, но некоторые социально важные (часть продуктов, лекарства, образование) освобождены или льготные. Точный список установлен законом."}, {"q": "Платит ли НДС физлицо?", "a": "Напрямую нет, но при каждой покупке платит НДС, добавленный к цене. Регистрация плательщиком НДС — только для бизнеса."}, {"q": "Можно ли вернуть НДС?", "a": "Плательщик НДС вычитает входящий НДС из исходящего и платит разницу. Если входящий больше, излишек может быть возвращён или перенесён на следующий период."}, {"q": "Можно ли работать без НДС?", "a": "Да, малый бизнес с оборотом ниже порога или на спецрежиме работает без НДС. При этом НДС клиенту не добавляется, но и входящий НДС не возвращается."}]}};
  var UI={uz:{back:'← Barcha maqolalar',home:'Bosh sahifa',date:'24-iyul, 2026'},ru:{back:'← Все статьи',home:'Главная',date:'24-iyul, 2026'}};
  var lang='uz';
  function render(){
    document.documentElement.lang=lang;
    document.getElementById('artTag').textContent=DATA[lang].tag;
    document.getElementById('artTitle').textContent=DATA[lang].title;
    document.getElementById('artMeta').textContent=UI[lang].date;
    document.getElementById('artBody').innerHTML=DATA[lang].body;
    var faqHtml='<h2 style="margin-top:28px">'+(lang==='ru'?'Частые вопросы':'Ko\'p beriladigan savollar')+'</h2>';
    var fq=DATA[lang].faq||[];
    for(var i=0;i<fq.length;i++){faqHtml+='<div style="border-bottom:1px solid #E3E9E4;padding:12px 0"><div style="font-weight:800;font-size:15px;margin-bottom:5px">'+fq[i].q+'</div><div style="font-size:14px;color:#33403A">'+fq[i].a+'</div></div>';}
    document.getElementById('artBody').innerHTML+=faqHtml;
    document.getElementById('backBlog').textContent=UI[lang].back;
    document.getElementById('backHome').textContent=UI[lang].home;
    document.getElementById('langUz').classList.toggle('on',lang==='uz');
    document.getElementById('langRu').classList.toggle('on',lang==='ru');
    buildSchema();
  }
  function buildSchema(){
    var old=document.getElementById('art-ld');if(old)old.remove();
    var s=document.createElement('script');s.type='application/ld+json';s.id='art-ld';
    s.textContent=JSON.stringify({"@context":"https://schema.org","@type":"Article",
      "headline":DATA[lang].title,"datePublished":"2026-07-24","inLanguage":lang,
      "author":{"@type":"Organization","name":"Kalki.uz"},
      "publisher":{"@type":"Organization","name":"Kalki.uz"}});
    document.head.appendChild(s);
    var fq2=DATA[lang].faq||[];
    if(fq2.length){
      var oldF=document.getElementById('art-faq-ld');if(oldF)oldF.remove();
      var sf=document.createElement('script');sf.type='application/ld+json';sf.id='art-faq-ld';
      sf.textContent=JSON.stringify({"@context":"https://schema.org","@type":"FAQPage","mainEntity":fq2.map(function(x){return{"@type":"Question","name":x.q,"acceptedAnswer":{"@type":"Answer","text":x.a}};})});
      document.head.appendChild(sf);
    }
  }
  document.getElementById('langUz').onclick=function(){lang='uz';render()};
  document.getElementById('langRu').onclick=function(){lang='ru';render()};
  render();
})();
</script>
