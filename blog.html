<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Maqolalar — Kalki.uz blog</title>
<meta name="description" content="Kalki.uz maqolalari: soliq, ipoteka, bojxona, DTM va O'zbekistondagi moliyaviy yangiliklar haqida foydali maqolalar. Полезные статьи о финансах в Узбекистане.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--cat:#1A2B24;--accent:#D99A2B;--cat-text:#C9D6CE;--paper:#F7F8F6;--card:#FFFFFF;--ink:#16211C;--muted:#5C6B63;--line:#DDE5E0;--radius:14px}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}
header{background:var(--cat);color:#fff;padding:22px 16px 30px;min-height:110px}
header .wrap{padding-bottom:0}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--cat-text);text-decoration:none}
.brand-dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.lang-seg{display:flex;background:rgba(255,255,255,.14);border-radius:9px;padding:3px;gap:3px}
.lang-seg button{border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:800;color:var(--cat-text);padding:6px 12px;border-radius:7px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.lang-seg button.on{background:#fff;color:var(--cat)}
h1{font-size:25px;font-weight:800}
.tagline{margin-top:8px;font-size:14.5px;color:var(--cat-text)}
main{padding-top:24px}
.post-card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px;text-decoration:none;color:var(--ink);transition:border-color .15s}
.post-card:hover{border-color:var(--accent)}
.post-card .tag{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:7px}
.post-card h2{font-size:18px;font-weight:800;line-height:1.3;margin-bottom:6px}
.post-card p{font-size:13.5px;color:var(--muted);line-height:1.5}
.post-card .date{font-size:12px;color:#93A099;font-weight:600;margin-top:8px}
footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
footer a{color:var(--muted);text-decoration:none}
</style>
<script src="ga.js" defer></script>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:image" content="https://kalki.uz/og-image.png">
</head>
<body>
<header>
  <div class="wrap">
    <div class="topbar">
      <a class="brand" href="./"><span class="brand-dot"></span>Kalki.uz</a>
      <div class="lang-seg"><button type="button" id="langUz" class="on">UZ</button><button type="button" id="langRu">RU</button></div>
    </div>
    <h1 id="pageTitle"></h1>
    <p class="tagline" id="pageTagline"></p>
  </div>
</header>
<main class="wrap" id="postList"></main>
<footer class="wrap">
  <div><a href="./" id="backHome"></a> · <a href="biz-haqimizda" id="aboutLink"></a></div>
</footer>

<script>
(function(){
  var POSTS=[
    {slug:'ipoteka-2026', tag:{uz:'Moliya',ru:'Финансы'}, date:'2026-07-20',
     title:{uz:'2026-yilda ipoteka: stavkalar, imtiyozlar va hisob-kitob',ru:'Ипотека в 2026: ставки, льготы и расчёт'},
     desc:{uz:'Ipoteka olishni rejalashtiryapsizmi? 2026-yil stavkalari, imtiyozli dasturlar va oylik to’lovni qanday hisoblash haqida.',ru:'Планируете ипотеку? О ставках 2026, льготных программах и расчёте платежа.'}},
    {slug:'dtm-2026', tag:{uz:'Ta’lim',ru:'Образование'}, date:'2026-07-18',
     title:{uz:'DTM 2026: ball qanday hisoblanadi va grantga qancha kerak',ru:'ДТМ 2026: как считается балл и сколько нужно на грант'},
     desc:{uz:'Blok koeffitsiyentlari, sertifikat imtiyozlari va grant uchun kerakli ball haqida to’liq qo’llanma.',ru:'Полное руководство: коэффициенты блоков, льготы по сертификатам и проходной балл.'}},
    {slug:'avto-bojxona-2026', tag:{uz:'Avto',ru:'Авто'}, date:'2026-07-15',
     title:{uz:'Avtomobil import qilish: 2026-yil bojxona to’lovlari',ru:'Импорт авто: таможенные платежи в 2026'},
     desc:{uz:'Mashina olib kelmoqchimisiz? Boj, aksiz, QQS va elektromobil imtiyozlari qanday hisoblanishi haqida.',ru:'Ввозите машину? О пошлине, акцизе, НДС и льготах на электромобили.'}}
  ];
  var I={
    uz:{title:'Maqolalar',tagline:'O’zbekistondagi moliya, soliq va foydali mavzular haqida.',back:'← Bosh sahifa',about:'Biz haqimizda'},
    ru:{title:'Статьи',tagline:'О финансах, налогах и полезных темах в Узбекистане.',back:'← Главная',about:'О проекте'}
  };
  var lang='uz';
  function render(){
    document.documentElement.lang=lang;
    document.getElementById('pageTitle').textContent=I[lang].title;
    document.getElementById('pageTagline').textContent=I[lang].tagline;
    document.getElementById('backHome').textContent=I[lang].back;
    document.getElementById('aboutLink').textContent=I[lang].about;
    var html='';
    for(var i=0;i<POSTS.length;i++){
      var p=POSTS[i];
      var d=new Date(p.date).toLocaleDateString(lang==='uz'?'uz-UZ':'ru-RU',{year:'numeric',month:'long',day:'numeric'});
      html+='<a class="post-card" href="'+p.slug+'"><span class="tag">'+p.tag[lang]+'</span>'
        +'<h2>'+p.title[lang]+'</h2><p>'+p.desc[lang]+'</p><div class="date">'+d+'</div></a>';
    }
    document.getElementById('postList').innerHTML=html;
    document.getElementById('langUz').classList.toggle('on',lang==='uz');
    document.getElementById('langRu').classList.toggle('on',lang==='ru');
  }
  document.getElementById('langUz').onclick=function(){lang='uz';render()};
  document.getElementById('langRu').onclick=function(){lang='ru';render()};
  render();
})();
</script>
</body>
</html>
